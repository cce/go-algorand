name: Release Build

# Called by release-trigger.yml. Building and attesting inside a reusable
# workflow makes it the signer of the attestations, so verifiers can require it
# with `gh attestation verify --signer-workflow` (SLSA v1.0 Build Level 3).
on:
  workflow_call:
    inputs:
      version:
        description: 'Version (e.g., 4.5.0); manual runs only'
        required: false
        type: string
      channel:
        description: 'Release channel; manual runs only'
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  # Disable deadlock detection for release builds
  ALGORAND_DEADLOCK: disable
  KMD_NOUSB: True
  # Linux release builds install their toolchain from this Ubuntu archive
  # snapshot, inside the base image pinned in the build matrix, so every run
  # links the same glibc and uses the same gcc and binutils. Change the two
  # together and deliberately: either one changes the release bytes. The
  # snapshot must not predate the image's build: apt will not downgrade the
  # packages the image already has, so an older snapshot can leave the
  # toolchain's dependencies unsatisfiable (as perl vs perl-base did on arm64).
  UBUNTU_SNAPSHOT: 20261111T000000Z

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      network: ${{ steps.parse.outputs.network }}
      source_date_epoch: ${{ steps.parse.outputs.source_date_epoch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse version and channel
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use inputs directly
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            # Tag trigger - parse from tag
            # Expected format: v{major}.{minor}.{patch}-{channel}
            # Examples: v4.5.0-beta, v4.5.0-stable
            TAG="${GITHUB_REF_NAME}"
            echo "Parsing tag: ${TAG}"

            # Extract channel (last component after final hyphen): v4.5.0-beta -> beta
            CHANNEL="${TAG##*-}"

            # Validate channel first
            case "$CHANNEL" in
              beta|stable|nightly|dev) ;;
              *)
                echo "Error: Tag must end with -beta, -stable, -nightly, or -dev"
                echo "Got: ${TAG}"
                exit 1
                ;;
            esac

            # Extract version: v4.5.0-beta -> 4.5.0
            # Remove the 'v' prefix and the '-channel' suffix
            VERSION="${TAG#v}"
            VERSION="${VERSION%-${CHANNEL}}"
          fi

          # Validate version format (major.minor.patch)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format: ${VERSION}"
            echo "Expected format: major.minor.patch (e.g., 4.5.0)"
            echo "Tag format should be: v{major}.{minor}.{patch}-{channel}"
            exit 1
          fi

          # Map channel to network
          case "$CHANNEL" in
            beta)    NETWORK="betanet" ;;
            stable)  NETWORK="mainnet" ;;
            nightly) NETWORK="devnet" ;;
            dev)     NETWORK="devnet" ;;
            *)
              echo "Error: Invalid channel: ${CHANNEL}"
              exit 1
              ;;
          esac

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "network=${NETWORK}" >> "$GITHUB_OUTPUT"
          # Commit time, used as the fixed timestamp in every release artifact so
          # that rebuilding the same commit reproduces the same bytes.
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

          echo "Release Configuration:"
          echo "  Version: ${VERSION}"
          echo "  Channel: ${CHANNEL}"
          echo "  Network: ${NETWORK}"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            make_target: ci-build
            container: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            make_target: ci-build
            container: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
          - runner: macos-15
            os: darwin
            arch: universal
            make_target: ci-build-universal
            container: ''
            xcode: '16.4'
    runs-on: ${{ matrix.runner }}
    # An empty image (macOS) runs the job directly on the runner.
    container:
      image: ${{ matrix.container }}
      volumes:
        # The base image has no CA certificates; the runner's are used to reach
        # the archive snapshot over https. apt still checks the archive's
        # signatures.
        - /etc/ssl/certs:/etc/ssl/certs:ro
    env:
      BUILD_CONTAINER_IMAGE: ${{ matrix.container }}
      # -trimpath does not rewrite assembly files a package #includes from
      # another directory (gnark-crypto's field/asm), so the module cache path
      # ends up in the binaries' debug info. A fixed path, recorded in the
      # build environment attestation, keeps rebuilds byte-identical.
      GOMODCACHE: /tmp/go-algorand-release/pkg/mod
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      NETWORK: ${{ needs.prepare.outputs.network }}
      VERSION: ${{ needs.prepare.outputs.version }}
      FULLVERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      # These are used by compute_branch_channel.sh and other scripts
      TRAVIS_BRANCH: ''
      BRANCH: ''
    steps:
      # Runs before checkout because checkout needs git. Only the snapshot is
      # configured, so nothing comes from the live archive.
      - name: Install pinned Linux toolchain
        if: matrix.os == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          rm -f /etc/apt/sources.list.d/ubuntu.sources
          cat > /etc/apt/sources.list.d/snapshot.sources <<EOF
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/${UBUNTU_SNAPSHOT}/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt-get update
          apt-get install -y --no-install-recommends build-essential autoconf automake libtool git jq
          # The workspace belongs to the runner's user, not the container's
          # root. actions/checkout only marks it safe for its own step, and the
          # build needs git for version stamping.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Fails if the runner image no longer ships this Xcode, rather than
      # building with whichever one is the default.
      - name: Select Xcode
        if: matrix.os == 'darwin'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-prefix: release-${{ matrix.os }}-${{ matrix.arch }}

      - name: Build binaries
        run: |
          echo "Building for ${{ matrix.os }}-${{ matrix.arch }}"
          echo "  Version: ${VERSION}"
          echo "  Channel: ${CHANNEL}"
          echo "  Network: ${NETWORK}"
          make ${{ matrix.make_target }}

      # Rides along in the build artifact so the packaging jobs can bind it to
      # the final packages; it must be taken on the runner that did the build.
      - name: Record build environment
        run: scripts/build_environment.sh build > tmp/node_pkgs/build-environment.json

      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          find tmp/node_pkgs -type f | head -50 || echo "No artifacts found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: tmp/node_pkgs/
          retention-days: 7
          if-no-files-found: error

  package-linux:
    name: Package Linux ${{ matrix.arch }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            goarch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            goarch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      DEFAULTNETWORK: ${{ needs.prepare.outputs.network }}
      GOARCH: ${{ matrix.goarch }}
      # nFPM uses this for every file and header timestamp in the .deb/.rpm.
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: tmp/node_pkgs/

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.45.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Compute package names
        id: pkgname
        run: |
          # Only beta channel uses algorand-beta, others use algorand
          if [ "$CHANNEL" = "beta" ]; then
            PKG_NAME="algorand-beta"
            DEVTOOLS_PKG_NAME="algorand-devtools-beta"
            CONFLICTS_PKG_NAME="algorand"
            CONFLICTS_DEVTOOLS_PKG_NAME="algorand-devtools"
          else
            PKG_NAME="algorand"
            DEVTOOLS_PKG_NAME="algorand-devtools"
            CONFLICTS_PKG_NAME="algorand-beta"
            CONFLICTS_DEVTOOLS_PKG_NAME="algorand-devtools-beta"
          fi
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "devtools_pkg_name=${DEVTOOLS_PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "conflicts_pkg_name=${CONFLICTS_PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "conflicts_devtools_pkg_name=${CONFLICTS_DEVTOOLS_PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Package name: ${PKG_NAME}"
          echo "Devtools package name: ${DEVTOOLS_PKG_NAME}"

      - name: Locate binaries
        id: binaries
        run: |
          # Find the directory containing the built binaries
          BINDIR=$(find tmp/node_pkgs -type d -name "bin" | head -1)
          if [ -z "$BINDIR" ]; then
            echo "Error: Could not find bin directory in artifacts"
            find tmp/node_pkgs -type f | head -20
            exit 1
          fi
          # Convert to absolute path
          BINDIR=$(cd "$BINDIR" && pwd)
          echo "bindir=${BINDIR}" >> "$GITHUB_OUTPUT"
          echo "Found binaries in: ${BINDIR}"
          ls -la "${BINDIR}"

          # Find the tools directory (devtools binaries)
          TOOLSDIR=$(find tmp/node_pkgs -type d -name "tools" | head -1)
          if [ -z "$TOOLSDIR" ]; then
            echo "Error: Could not find tools directory in artifacts"
            exit 1
          fi
          TOOLSDIR=$(cd "$TOOLSDIR" && pwd)
          echo "toolsdir=${TOOLSDIR}" >> "$GITHUB_OUTPUT"
          echo "Found tools in: ${TOOLSDIR}"
          ls -la "${TOOLSDIR}"

      - name: Generate Debian copyright file
        run: |
          mkdir -p .github/packaging/generated
          cat > .github/packaging/generated/copyright << 'COPYRIGHT_EOF'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: Algorand
          Upstream-Contact: Algorand developers <dev@algorand.com>
          Source: https://github.com/algorand/go-algorand

          Files: *
          Copyright: Algorand developers <dev@algorand.com>
          License: AGPL-3+
          COPYRIGHT_EOF
          sed 's/^$/./g' < COPYING | sed 's/^/ /g' >> .github/packaging/generated/copyright

      - name: Generate unattended-upgrades config
        run: |
          mkdir -p .github/packaging/generated
          cat > .github/packaging/generated/51algorand-upgrades << EOF
          ## This file is provided by the Algorand package to configure
          ## unattended upgrades for the Algorand node software.

          Unattended-Upgrade::Allowed-Origins {
            "Algorand:${CHANNEL}";
          };

          Dpkg::Options {
             "--force-confdef";
             "--force-confold";
          };
          EOF

      - name: Build Debian packages
        env:
          BINDIR: ${{ steps.binaries.outputs.bindir }}
          TOOLSDIR: ${{ steps.binaries.outputs.toolsdir }}
          SRCDIR: ${{ github.workspace }}
          PKG_NAME: ${{ steps.pkgname.outputs.pkg_name }}
          DEVTOOLS_PKG_NAME: ${{ steps.pkgname.outputs.devtools_pkg_name }}
          CONFLICTS_PKG_NAME: ${{ steps.pkgname.outputs.conflicts_pkg_name }}
          CONFLICTS_DEVTOOLS_PKG_NAME: ${{ steps.pkgname.outputs.conflicts_devtools_pkg_name }}
        run: |
          mkdir -p dist

          # Build main algorand package
          nfpm pkg \
            -f .github/packaging/algorand.nfpm.yaml \
            -p deb \
            -t "dist/algorand_${CHANNEL}_linux-${{ matrix.arch }}_${VERSION}.deb"

          # Build devtools package
          nfpm pkg \
            -f .github/packaging/algorand-devtools.nfpm.yaml \
            -p deb \
            -t "dist/algorand-devtools_${CHANNEL}_linux-${{ matrix.arch }}_${VERSION}.deb"

          echo "Built Debian packages:"
          ls -la dist/*.deb

      - name: Build RPM packages
        env:
          BINDIR: ${{ steps.binaries.outputs.bindir }}
          TOOLSDIR: ${{ steps.binaries.outputs.toolsdir }}
          SRCDIR: ${{ github.workspace }}
          PKG_NAME: ${{ steps.pkgname.outputs.pkg_name }}
          DEVTOOLS_PKG_NAME: ${{ steps.pkgname.outputs.devtools_pkg_name }}
          CONFLICTS_PKG_NAME: ${{ steps.pkgname.outputs.conflicts_pkg_name }}
          CONFLICTS_DEVTOOLS_PKG_NAME: ${{ steps.pkgname.outputs.conflicts_devtools_pkg_name }}
        run: |
          # Build main algorand package
          nfpm pkg \
            -f .github/packaging/algorand.nfpm.yaml \
            -p rpm \
            -t "dist/${PKG_NAME}-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"

          # Build devtools package
          nfpm pkg \
            -f .github/packaging/algorand-devtools.nfpm.yaml \
            -p rpm \
            -t "dist/${DEVTOOLS_PKG_NAME}-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"

          echo "Built RPM packages:"
          ls -la dist/*.rpm

      - name: Copy tarballs from build artifacts
        run: |
          find tmp/node_pkgs -name "*.tar.gz" -exec cp {} dist/ \;
          echo "Tarballs:"
          ls -la dist/*.tar.gz

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.deb *.rpm > "hashes_${CHANNEL}_linux_${{ matrix.arch }}_${VERSION}"
          echo "Checksums:"
          cat "hashes_${CHANNEL}_linux_${{ matrix.arch }}_${VERSION}"

      - name: Record build environment
        run: |
          scripts/build_environment.sh package > tmp/package-environment.json
          jq -n --slurpfile build tmp/node_pkgs/build-environment.json \
            --slurpfile packaging tmp/package-environment.json \
            '{build: $build[0], packaging: $packaging[0]}' \
            > "dist/build-environment_${CHANNEL}_linux-${{ matrix.arch }}_${VERSION}.json"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  package-darwin:
    name: Package Darwin
    needs: [prepare, build]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-darwin-universal
          path: tmp/node_pkgs/

      - name: Organize Darwin packages
        run: |
          mkdir -p dist

          # The build step already creates tarballs - copy them
          find tmp/node_pkgs -name "*.tar.gz" -exec cp {} dist/ \;

          echo "Darwin packages:"
          ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz > "hashes_${CHANNEL}_darwin_universal_${VERSION}"
          echo "Checksums:"
          cat "hashes_${CHANNEL}_darwin_universal_${VERSION}"

      - name: Record build environment
        run: |
          jq '{build: .}' tmp/node_pkgs/build-environment.json \
            > "dist/build-environment_${CHANNEL}_darwin-universal_${VERSION}.json"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-darwin-universal
          path: dist/
          retention-days: 7
          if-no-files-found: error

  test-packages:
    name: Test ${{ matrix.distro }} ${{ matrix.arch }}
    needs: [prepare, package-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            distro: ubuntu
            image: ubuntu:24.04
            pkg_type: deb
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: ubuntu
            image: ubuntu:24.04
            pkg_type: deb
          - runner: ubuntu-24.04
            arch: amd64
            distro: fedora
            image: fedora:40
            pkg_type: rpm
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: fedora
            image: fedora:40
            pkg_type: rpm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: packages/

      - name: Compute package name
        id: pkgname
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            PKG_NAME="algorand-beta"
            DEVTOOLS_PKG_NAME="algorand-devtools-beta"
          else
            PKG_NAME="algorand"
            DEVTOOLS_PKG_NAME="algorand-devtools"
          fi
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "devtools_pkg_name=${DEVTOOLS_PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Test Debian package installation
        if: matrix.pkg_type == 'deb'
        run: |
          PKG_NAME="${{ steps.pkgname.outputs.pkg_name }}"
          DEB_FILE="packages/algorand_${CHANNEL}_linux-${{ matrix.arch }}_${VERSION}.deb"

          echo "Testing: ${DEB_FILE}"
          ls -la "$DEB_FILE"

          docker run --rm -v "$(pwd)/packages:/packages" ${{ matrix.image }} bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            # Use --no-install-recommends to skip unattended-upgrades (pulls in systemd-resolved which fails in containers)
            apt-get install -y --no-install-recommends /packages/algorand_${CHANNEL}_linux-${{ matrix.arch }}_${VERSION}.deb

            # Verify binaries are installed
            command -v algod
            command -v goal
            command -v kmd

            # Verify version output
            algod -v

            # Verify systemd service file exists
            test -f /lib/systemd/system/algorand.service

            # Verify data directory
            test -d /var/lib/algorand

            echo 'Debian main package test passed!'

            # Install and test devtools package
            apt-get install -y --no-install-recommends /packages/algorand-devtools_${CHANNEL}_linux-${{ matrix.arch }}_${VERSION}.deb

            # Verify devtools binaries are installed
            command -v carpenter
            command -v msgpacktool

            echo 'Debian devtools package test passed!'
          "

      - name: Test RPM package installation
        if: matrix.pkg_type == 'rpm'
        run: |
          PKG_NAME="${{ steps.pkgname.outputs.pkg_name }}"
          DEVTOOLS_PKG_NAME="${{ steps.pkgname.outputs.devtools_pkg_name }}"
          RPM_ARCH="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"
          RPM_FILE="packages/${PKG_NAME}-${VERSION}-1.${RPM_ARCH}.rpm"

          echo "Testing: ${RPM_FILE}"
          ls -la "$RPM_FILE"

          docker run --rm -v "$(pwd)/packages:/packages" ${{ matrix.image }} bash -c "
            set -e
            dnf install -y /packages/${PKG_NAME}-${VERSION}-1.${RPM_ARCH}.rpm

            # Verify binaries are installed
            command -v algod
            command -v goal
            command -v kmd

            # Verify version output
            algod -v

            # Verify systemd service file exists
            test -f /lib/systemd/system/algorand.service

            # Verify data directory
            test -d /var/lib/algorand

            echo 'RPM main package test passed!'

            # Install and test devtools package
            dnf install -y /packages/${DEVTOOLS_PKG_NAME}-${VERSION}-1.${RPM_ARCH}.rpm

            # Verify devtools binaries are installed
            command -v carpenter
            command -v msgpacktool

            echo 'RPM devtools package test passed!'
          "

  # The SBOM and build-environment attestations are made per platform, so each
  # artifact is bound to a description of the binaries it ships and of the
  # toolchain that built them, rather than to the source tree.
  attest-platform:
    name: Attest ${{ matrix.platform }} (SBOM, build environment)
    needs: [prepare, package-linux, package-darwin, test-packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            subjects: |
              packages/*_linux-amd64_*.tar.gz
              packages/*_linux-amd64_*.deb
              packages/*.x86_64.rpm
          - platform: linux-arm64
            subjects: |
              packages/*_linux-arm64_*.tar.gz
              packages/*_linux-arm64_*.deb
              packages/*.aarch64.rpm
          - platform: darwin-universal
            subjects: |
              packages/*_darwin-universal_*.tar.gz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages/
          merge-multiple: true

      # The .deb and .rpm packages hold the same binaries as the tarballs.
      # sbom/ is created here because anchore/sbom-action writes output-file
      # without creating its directory.
      - name: Extract shipped binaries
        run: |
          mkdir -p extracted sbom
          for f in packages/*_${{ matrix.platform }}_*.tar.gz; do
            tar -xzf "$f" -C extracted
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: extracted
          format: spdx-json
          output-file: sbom/sbom_${{ env.CHANNEL }}_${{ matrix.platform }}_${{ env.VERSION }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.subjects }}
          sbom-path: sbom/sbom_${{ env.CHANNEL }}_${{ matrix.platform }}_${{ env.VERSION }}.spdx.json

      - name: Attest build environment
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.subjects }}
          predicate-type: https://github.com/algorand/go-algorand/build-environment/v1
          predicate-path: packages/build-environment_${{ env.CHANNEL }}_${{ matrix.platform }}_${{ env.VERSION }}.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.platform }}
          path: sbom/
          retention-days: 7
          if-no-files-found: error

  finalize:
    name: Finalize (Provenance)
    needs: [prepare, package-linux, package-darwin, test-packages, attest-platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages/
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: packages/
          merge-multiple: true

      - name: List all artifacts
        run: |
          echo "All release artifacts:"
          find packages/ -type f | sort

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            packages/*.tar.gz
            packages/*.deb
            packages/*.rpm

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: packages/
          retention-days: 7
          if-no-files-found: error

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # osv-scanner's Go call analysis type-checks the code, and the crypto
      # package's cgo code needs libsodium's headers; without them the analysis
      # fails and osv-scanner can crash. This also gives the scan the release
      # Go version, whose standard library is what ships.
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-prefix: release-scan

      - name: Install and run osv-scanner
        run: |
          # osv-scanner v2.3.3 needs a newer Go to build than the release
          # pins; only this install may fetch one.
          GOTOOLCHAIN=auto go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3

          # Run scan with JSON output for deterministic parsing.
          # osv-scanner exits 1 when vulnerabilities are found; any other
          # non-zero exit (127 error, 128 no packages, 129 API failure, or a
          # crash) means the scan did not complete and must not pass.
          set +e
          osv-scanner scan --recursive --format json . > osv-results.json 2>osv-stderr.txt
          SCAN_EXIT=$?
          set -e

          if [ "$SCAN_EXIT" -eq 0 ]; then
            echo "No vulnerabilities found."
            exit 0
          fi
          if [ "$SCAN_EXIT" -ne 1 ] || ! jq -e '.results' osv-results.json > /dev/null; then
            cat osv-stderr.txt
            echo "::error::osv-scanner did not complete (exit ${SCAN_EXIT})."
            exit 1
          fi

          # Also produce human-readable table for the job log
          osv-scanner scan --recursive . 2>&1 || true

          # Check for critical vulnerabilities using structured JSON.
          # The OSV schema stores severity as CVSS vector strings in
          # severity[].score. For CVSS_V3, the vector looks like:
          #   CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
          # We can't easily compute the base score from the vector in jq,
          # so we check two reliable sources:
          #
          # 1. database_specific.severity — used by GitHub Advisory DB and
          #    Go Vulnerability DB. Values: "CRITICAL", "HIGH", "MODERATE", "LOW".
          #
          # 2. database_specific.cvss_score — numeric score included by some
          #    advisory sources. Critical = >= 9.0.
          #
          # A critical advisory blocks the release unless osv-scanner's call
          # analysis (govulncheck, for Go) shows none of its vulnerable code is
          # called. Advisories without call analysis, such as those for
          # non-Go ecosystems, count as reachable.
          jq '
            def critical:
              ((.database_specific?.severity? // "") | ascii_upcase) == "CRITICAL" or
              ((.database_specific?.cvss_score? // 0) >= 9.0);
            [ .results[]?.packages[]? | .package as $pkg | (.groups // []) as $groups |
              .vulnerabilities[]? | select(critical) | .id as $id |
              ([ $groups[] | select(.ids | index($id)) ] | first // {}) as $group |
              [ ($group.experimental_analysis // {})[] | .called ] as $called |
              { id: $id, package: "\($pkg.name)@\($pkg.version)",
                reachable: (($called | length) == 0 or any($called[]; . != false)) }
            ] | group_by(.id)
              | map({id: .[0].id, packages: (map(.package) | unique), reachable: any(.[]; .reachable)})
          ' osv-results.json > critical.json

          jq -r '.[] | "\(if .reachable then "REACHABLE " else "not called" end)  \(.packages | join(","))  \(.id)"' critical.json
          REACHABLE=$(jq '[.[] | select(.reachable)] | length' critical.json)
          if [ "$REACHABLE" -gt 0 ]; then
            echo "::error::Found ${REACHABLE} critical vulnerabilities the code may reach; failing build."
            exit 1
          fi
          echo "::warning::Vulnerabilities found, but no critical ones the code reaches. See job log for details."
          exit 0

  # Summary job to verify all builds and packages completed
  release-summary:
    name: Release Summary
    needs: [prepare, build, package-linux, package-darwin, test-packages, attest-platform, finalize, vulnerability-scan]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Channel:** ${{ needs.prepare.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** ${{ needs.prepare.outputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Build status
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| Build | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Package status
          if [ "${{ needs.package-linux.result }}" = "success" ]; then
            echo "| Package Linux | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Package Linux | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.package-darwin.result }}" = "success" ]; then
            echo "| Package Darwin | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Package Darwin | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Test status
          if [ "${{ needs.test-packages.result }}" = "success" ]; then
            echo "| Package Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Package Tests | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Attestation status
          if [ "${{ needs.attest-platform.result }}" = "success" ]; then
            echo "| Attest (SBOM, build environment) | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Attest (SBOM, build environment) | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Finalize status
          if [ "${{ needs.finalize.result }}" = "success" ]; then
            echo "| Finalize (Provenance) | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Finalize (Provenance) | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Vulnerability scan status (fails only on criticals)
          if [ "${{ needs.vulnerability-scan.result }}" = "success" ]; then
            echo "| Dependency Scan | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dependency Scan | ❌ (critical vulnerabilities) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Final status
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.package-linux.result }}" != "success" ] || \
             [ "${{ needs.package-darwin.result }}" != "success" ] || \
             [ "${{ needs.test-packages.result }}" != "success" ] || \
             [ "${{ needs.attest-platform.result }}" != "success" ] || \
             [ "${{ needs.finalize.result }}" != "success" ] || \
             [ "${{ needs.vulnerability-scan.result }}" != "success" ]; then
            echo "❌ **Release failed.** Check individual job logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All stages completed successfully!**" >> $GITHUB_STEP_SUMMARY
          fi
