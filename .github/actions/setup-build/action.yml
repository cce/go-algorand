name: 'Setup Build Environment'
description: 'Set up Go, libsodium, and macOS build dependencies for release builds (Linux jobs install a pinned toolchain first)'
inputs:
  cache-prefix:
    description: 'Cache prefix for Go caching'
    required: false
    default: 'release'
runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: ./.github/actions/setup-go
      with:
        cache-prefix: ${{ inputs.cache-prefix }}

    # libsodium is deliberately not cached: it is linked into the release
    # binaries, so it is rebuilt from source rather than restored from an
    # artifact written by some earlier run.

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Homebrew packages needed for libsodium build; gnu-tar provides the
        # gtar that build_packages.sh needs to write reproducible tarballs
        brew install autoconf automake libtool gnu-tar

    - name: Build libsodium
      shell: bash
      run: make libsodium
